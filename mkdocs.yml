site_name: EMBS Book
site_description: Embedded Systems Design and Implementation (EMBS) Module at the University of York
site_author: Dr Steven Xiaotian Dai
site_url: https://automaticdai.github.io/embs-book/

repo_name: automaticdai/embs-book
repo_url: https://github.com/automaticdai/embs-book

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/automaticdai/embs-book

copyright: Copyright &copy; Dr Steven Xiaotian Dai, University of York

nav:
  - Home: index.md
  - Getting Started:
    - Module Overview: getting-started/overview.md
    - How to Use This Book: getting-started/how-to-use.md
  - HW/SW Co-Design:
    - Introduction: hw-sw-codesign/introduction.md
    - Design Space Exploration: hw-sw-codesign/design-space-exploration.md
    - Partitioning: hw-sw-codesign/partitioning.md
    - Mapping: hw-sw-codesign/mapping.md
    - "Interactive: KL Algorithm": tutorials/kl-algorithm.md
