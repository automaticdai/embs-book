site_name: EMBS Book
site_description: Embedded Systems Design and Implementation (EMBS) Module at the University of York
site_author: Dr Steven Xiaotian Dai
site_url: https://embs-book.github.io/

repo_name: embs-book/embs-book.github.io
repo_url: https://github.com/embs-book/embs-book.github.io

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/chip
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/embs-book/embs-book.github.io

copyright: Copyright &copy; Dr Steven Xiaotian Dai, University of York

nav:
  - Home: index.md
  - Getting Started:
    - Module Overview: getting-started/overview.md
    - How to Use This Book: getting-started/how-to-use.md
  - HW/SW Co-Design:
    - Introduction: hw-sw-codesign/introduction.md
    - Design Space Exploration: hw-sw-codesign/design-space-exploration.md
    - Partitioning: hw-sw-codesign/partitioning.md
    - Mapping: hw-sw-codesign/mapping.md
  - Interactive Tutorials:
    - Kernighan–Lin Algorithm: tutorials/kl-algorithm.md
    - Diffusion Load Balancing: tutorials/diffusion-algorithm.md
    - PDA vs QPA: tutorials/pda-qpa.md
  - Practicals: https://iangray001.github.io/embs/docs/practicals/
